<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <table class="table table-bordered">
        <tr>
          <th width="20%">Image</th>
          <th width="50%">Name</th>
          <th width="30%"></th>
        </tr>
        <tr *ngFor="let cartItem of cartItems">
          <td><img [src]="cartItem.imageUrl" alt="Image" width="100"></td>
          <td>{{cartItem.name}}
            {{cartItem.unitPrice | currency:'USD':true}} x {{cartItem.quantity}}
          </td>
          <td>
            <div class="items">
            <label>Quantity</label>
            <div class="row no-gutters">
              <div class="col">
                <button (click)="updateQuantity(cartItem)" class="btn btn-primary btn-sm">
                  <i class="fa fa-plus"></i>
                </button>
              </div>
              <div class="col ml-4 mr-2">
                {{cartItem.quantity}}
              </div>

              <div class="col">
                <button (click)="decrementQuantity(cartItem)" class="btn btn-primary btn-sm">
                  <i class="fa fa-minus"></i>
                </button>
              </div>

              <button (click)="remove(cartItem)" class="btn btn-danger btn-sm">
                <i class="fa fa-trash"></i>
              </button>

            </div>
          </div>

          <p class="subtotal">
            Subtotal: {{cartItem.unitPrice * cartItem.quantity | currency:'USD':true}}
          </p>
          </td>
        </tr>
        <tr>
          <td colspan="2" class="text-right">
            <strong>Total:</strong>
          </td>
          <td class="text-left">
            <strong>{{totalPrice | currency:'USD':true}}</strong>
          </td>
          <button routerLink="/checkout" class="btn btn-success btn-lg btn-block">
            Checkout
          </button>
        </tr>
      </table>
</div>
